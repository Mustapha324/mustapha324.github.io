<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">QIF to Unity internship workflow</title>
  <desc id="desc">QIF XML geometry is parsed in C++, translated through OpenCascade, and imported into Unity as a selectable mesh.</desc>
  <rect width="1200" height="380" fill="#141517"/>
  <path d="M0 320h1200M0 160h1200" stroke="#303236"/>
  <text x="46" y="57" fill="#f47b4b" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SIMJAM / METIL</text>
  <text x="46" y="98" fill="#f5f5f3" font-family="Arial,sans-serif" font-size="28" font-weight="700">Manufacturing data into interactive geometry</text>
  <g fill="#202225" stroke="#55595e" stroke-width="2"><rect x="45" y="145" width="240" height="150" rx="8"/><rect x="335" y="145" width="240" height="150" rx="8"/><rect x="625" y="145" width="240" height="150" rx="8"/><rect x="915" y="145" width="240" height="150" rx="8"/></g>
  <g font-family="Arial,sans-serif"><text x="67" y="182" fill="#f47b4b" font-size="14" font-weight="700">SOURCE</text><text x="357" y="182" fill="#f47b4b" font-size="14" font-weight="700">PARSER</text><text x="647" y="182" fill="#f47b4b" font-size="14" font-weight="700">GEOMETRY</text><text x="937" y="182" fill="#f47b4b" font-size="14" font-weight="700">IMPORT</text><text x="67" y="227" fill="#f4f3ef" font-size="25" font-weight="700">QIF XML</text><text x="357" y="227" fill="#f4f3ef" font-size="25" font-weight="700">C++</text><text x="647" y="227" fill="#f4f3ef" font-size="25" font-weight="700">OpenCascade</text><text x="937" y="227" fill="#f4f3ef" font-size="25" font-weight="700">Unity</text><text x="67" y="259" fill="#aaadb0" font-size="15">Curves &amp; topology</text><text x="357" y="259" fill="#aaadb0" font-size="15">Parse &amp; translate</text><text x="647" y="259" fill="#aaadb0" font-size="15">B-rep structures</text><text x="937" y="259" fill="#aaadb0" font-size="15">Selectable mesh</text></g>
  <path d="M295 220h27m-9-9 9 9-9 9M585 220h27m-9-9 9 9-9 9M875 220h27m-9-9 9 9-9 9" fill="none" stroke="#f47b4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="45" y="347" fill="#a9acaf" font-family="Arial,sans-serif" font-size="15">Workflow illustration based on internship experience; not a product screenshot.</text>
</svg>
